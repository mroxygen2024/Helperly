services:
  # PHP Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    container_name: servant_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      # Preserve vendor in container
      - /var/www/html/vendor
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_URI=${MONGODB_URI} # Compatibility for config/db.php
      - MONGODB_DB=${MONGODB_DB}
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - servant_network

  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: servant_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - servant_network

  # Redis (Optional but recommended for session/cache)
  redis:
    image: redis:alpine
    container_name: servant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - servant_network

networks:
  servant_network:
    driver: bridge

volumes:
  redis_data:
