services:
  # PHP Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${APP_ENV:-development}
    container_name: servant_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=${APP_ENV:-development}
      - MONGODB_URI=${MONGODB_URI}
      - MONGO_URI=${MONGODB_URI} # Compatibility for config/db.php
      - MONGODB_DB=${MONGODB_DB}
      - REDIS_HOST=redis
    depends_on:
      - redis
      - mongodb
    networks:
      - servant_network

  # Web Server (Nginx)
  web:
    image: nginx:alpine
    container_name: servant_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - servant_network

  # Redis (Optional but recommended for session/cache)
  redis:
    image: redis:alpine
    container_name: servant_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - servant_network

  # Database (MongoDB)
  mongodb:
    image: mongo:latest
    container_name: servant_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGODB_DB:-servant_db}
    volumes:
      - mongodb_data:/data/db
    networks:
      - servant_network

  # MongoDB GUI (Optional, useful for dev)
  mongo-express:
    image: mongo-express
    container_name: servant_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    depends_on:
      - mongodb
    networks:
      - servant_network

networks:
  servant_network:
    driver: bridge

volumes:
  redis_data:
  mongodb_data: