server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    
    # Ensure this directory exists inside BOTH containers
    root /var/www/html/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access_log;

    client_max_body_size 64M;

    # Main routing
    location / {
        # Check for file, then directory, then fall back to index.php
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing
    location ~ \.php$ {
        # Check if the file actually exists before passing to PHP-FPM
        # This prevents 404s being generated by Nginx instead of PHP
        try_files $uri =404;
        
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # 'app' must match your PHP service name in docker-compose.yml
        fastcgi_pass app:9000; 
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Crucial: This path must exist inside the PHP container
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Assets & Uploads
    location /assets/ {
        alias /var/www/html/assets/;
    }

    location /uploads/ {
        root /var/www/html/public;
    }

    location ~ /\. {
        deny all;
    }
}